<!doctype html><html lang="es"><head><meta charset=utf-8><title>Catálogo El Naranjito</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Catálogo El Naranjito</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: encabezado con logo, buscador y categorías pegajosos, lista de productos en una columna, barra de pedido fija abajo */
:root{
  --bg:#fffaf5; --surface:#ffffff; --fg:#2b1d12; --muted:#7d6a5a; --line:#f1e2d3;
  --accent:#ed7d22; --accent-ink:#ffffff; --accent-soft:#fdeedd; --accent-deep:#c45f0b;
  --display:'Fraunces',Georgia,serif; --body:'Nunito Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c130c;--surface:#271a10;--fg:#fbefe3;--muted:#b9a48f;--line:#3d2b1c;--accent:#f28a35;--accent-ink:#1c130c;--accent-soft:#3a2514;--accent-deep:#f6a05c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c130c;--surface:#271a10;--fg:#fbefe3;--muted:#b9a48f;--line:#3d2b1c;--accent:#f28a35;--accent-ink:#1c130c;--accent-soft:#3a2514;--accent-deep:#f6a05c;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);padding-inline:16px;padding-block:0 120px}
.wrap{max-width:640px;margin-inline:auto}
header{text-align:center;padding-top:20px}
header img{width:92px;height:auto;display:block;margin:0 auto 8px}
header h1{font:700 1.5rem/1.2 var(--display);margin:0;color:var(--accent-deep);text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:12px 8px;z-index:5;margin-top:12px}
#q{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:inherit}
#q:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:99px;font:600 .85rem var(--body);cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
h2{font:700 1.15rem var(--display);margin:22px 0 8px;color:var(--accent-deep)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:.95rem;overflow-wrap:anywhere}
.price{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.desc{color:var(--muted);font-size:.84rem;margin:2px 0 3px}
li.promo .price{color:var(--accent-deep);font-weight:700;font-size:1rem}
.qty{display:flex;align-items:center;gap:4px;flex:none}
.qty button{width:36px;height:36px;border-radius:50%;border:0;font:700 1.2rem/1 var(--body);cursor:pointer;background:var(--accent-soft);color:var(--accent-deep)}
.qty .plus{background:var(--accent);color:var(--accent-ink)}
.qty span{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:10}
.bar button.main{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;margin-inline:auto;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:14px 18px;font:700 1rem var(--body);cursor:pointer}
.bar button.main:disabled{background:var(--line);color:var(--muted);cursor:default}
.tot{font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;background:rgba(20,10,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h3{font:700 1.3rem var(--display);margin:0 0 12px;color:var(--accent-deep)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;font:700 1.25rem var(--display);padding:14px 0}
.panel label{display:block;font-weight:600;font-size:.85rem;margin:10px 0 4px}
.hint{margin:10px 0 0;font-size:.82rem;color:var(--accent-deep);text-align:center;min-height:1.2em}
.panel input,.panel textarea,.panel select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit}
.send{display:block;text-align:center;text-decoration:none;margin-top:16px;background:#25a244;color:#fff;padding:14px;border-radius:14px;font-weight:700}
.send.off{background:var(--line);color:var(--muted);pointer-events:none}
.ghost{width:100%;margin-top:8px;background:none;border:0;color:var(--muted);padding:10px;font:600 .9rem var(--body);cursor:pointer}
.note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:24px}
</style>
